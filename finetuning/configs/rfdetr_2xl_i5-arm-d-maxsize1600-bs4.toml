# Arm D fallback: identical to rfdetr_2xl_i5-arm-d-maxsize1600.toml except that
# the per-GPU micro-batch is halved and gradient accumulation is doubled, so the
# effective batch stays 4 x 2 x 8 = 64 and the arm remains comparable to arm A.
#
# Only used if the batch-8 launch fails with a CUDA out-of-memory error: raising
# the long-side cap from 1333 to 1600 increases the token count by about 1.44x,
# which may not fit in 24 GB at micro-batch 8.
[run]
status = "approved"
classification = "local_test_adapted"
ignored_iou_threshold = 0.5

[model]
name = "RFDETR2XLarge"
checkpoint = "weights/rfdetr/rf-detr-xxlarge.pth"
num_classes = 1
resolution = 1120
max_size = 1600
amp = true
gradient_checkpointing = true

[capacity]
group_detr = 13
num_queries = 390
num_select = 390
eval_max_dets = 390

[training]
batch_size = 4
grad_accum_steps = 2
devices = 8
strategy = "ddp"
sync_bn = true
epochs = 30
lr = 0.00005
lr_encoder = 0.000075
weight_decay = 0.0001
amp_dtype = "bf16"
multi_scale = true
do_random_resize_via_padding = true
square_resize_div_64 = false
scale_jitter = false
use_ema = true
eval_interval = 2
warmup_epochs = 1.0
lr_scheduler = "step"
lr_drop = 24
checkpoint_interval = 5
num_workers = 4
pin_memory = true
persistent_workers = true
save_dataset_grids = false
seed = 42
