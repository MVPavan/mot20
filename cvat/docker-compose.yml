# Isolated local CVAT deployment for MOT20 manual annotation. The pinned image
# matches the healthy on-host CVAT deployment inspected on 2026-08-31.
x-backend-env: &backend-env
  DJANGO_MODWSGI_EXTRA_ARGS: ""
  ALLOWED_HOSTS: "*"
  CVAT_REDIS_INMEM_HOST: cvat_redis_inmem
  CVAT_REDIS_INMEM_PORT: 6379
  CVAT_REDIS_INMEM_PASSWORD: ""
  CVAT_REDIS_ONDISK_HOST: cvat_redis_ondisk
  CVAT_REDIS_ONDISK_PORT: 6666
  CVAT_POSTGRES_HOST: cvat_db
  CVAT_POSTGRES_USER: root
  CVAT_POSTGRES_DBNAME: cvat
  CVAT_POSTGRES_PASSWORD: ""
  ADAPTIVE_AUTO_ANNOTATION: "false"
  SMOKESCREEN_OPTS: ""
  IAM_OPA_BUNDLE: "1"
  DJANGO_SETTINGS_MODULE: cvat.settings.mot20_local
  no_proxy: "opa,${no_proxy:-}"
  NUMPROCS: 2

services:
  cvat_db:
    image: postgres:16.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_DB: cvat
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes: [cvat_db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d cvat"]
      interval: 5s
      timeout: 5s
      retries: 20

  cvat_redis_inmem:
    image: redis:7.2.3-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "100", "--appendonly", "yes"]
    volumes: [cvat_inmem_data:/data]

  cvat_redis_ondisk:
    image: apache/kvrocks:2.7.0
    restart: unless-stopped
    command: ["--dir", "/var/lib/kvrocks/data"]
    init: true
    volumes: [cvat_cache_db:/var/lib/kvrocks/data]

  cvat_opa:
    image: openpolicyagent/opa:0.63.0
    restart: unless-stopped
    command: ["run", "--server", "--addr", ":8181", "--set=decision_logs.console=true", "--set=services.cvat.url=http://cvat-server:8080", "--set=bundles.cvat.service=cvat", "--set=bundles.cvat.resource=/api/auth/rules", "--set=bundles.cvat.polling.min_delay_seconds=5", "--set=bundles.cvat.polling.max_delay_seconds=15"]
    networks:
      default:
        aliases: [opa]

  cvat_server:
    image: cvat/server:v2.18.0
    restart: unless-stopped
    depends_on: [cvat_db, cvat_redis_inmem, cvat_redis_ondisk, cvat_opa]
    environment:
      <<: *backend-env
      DJANGO_LOG_SERVER_HOST: cvat_server
      DJANGO_LOG_SERVER_PORT: 8282
      CVAT_BASE_URL: ""
      ONE_RUNNING_JOB_IN_QUEUE_PER_USER: "true"
    command: init run server
    volumes:
      - cvat_data:/home/django/data
      - cvat_keys:/home/django/keys
      - cvat_logs:/home/django/logs
      - ./config/mot20_local.py:/home/django/cvat/settings/mot20_local.py:ro
      - "${CVAT_SHARE_PATH:?Set_CVAT_SHARE_PATH_in_cvat/.env}:/home/django/share/mot20-test:ro"
    networks:
      default:
        aliases: [cvat-server]

  cvat_utils:
    image: cvat/server:v2.18.0
    restart: unless-stopped
    depends_on: [cvat_db, cvat_redis_inmem, cvat_redis_ondisk, cvat_opa]
    environment: {<<: *backend-env, NUMPROCS: 1}
    command: run utils
    volumes: [cvat_data:/home/django/data, cvat_keys:/home/django/keys, cvat_logs:/home/django/logs, ./config/mot20_local.py:/home/django/cvat/settings/mot20_local.py:ro]

  cvat_worker_import:
    image: cvat/server:v2.18.0
    restart: unless-stopped
    depends_on: [cvat_db, cvat_redis_inmem, cvat_redis_ondisk, cvat_opa]
    environment: *backend-env
    command: run worker.import
    volumes: [cvat_data:/home/django/data, cvat_keys:/home/django/keys, cvat_logs:/home/django/logs, ./config/mot20_local.py:/home/django/cvat/settings/mot20_local.py:ro, "${CVAT_SHARE_PATH:?Set_CVAT_SHARE_PATH_in_cvat/.env}:/home/django/share/mot20-test:ro"]

  cvat_worker_export:
    image: cvat/server:v2.18.0
    restart: unless-stopped
    depends_on: [cvat_db, cvat_redis_inmem, cvat_redis_ondisk, cvat_opa]
    environment: *backend-env
    command: run worker.export
    volumes: [cvat_data:/home/django/data, cvat_keys:/home/django/keys, cvat_logs:/home/django/logs, ./config/mot20_local.py:/home/django/cvat/settings/mot20_local.py:ro]

  cvat_worker_annotation:
    image: cvat/server:v2.18.0
    restart: unless-stopped
    depends_on: [cvat_db, cvat_redis_inmem, cvat_redis_ondisk, cvat_opa]
    environment: {<<: *backend-env, NUMPROCS: 1}
    command: run worker.annotation
    volumes: [cvat_data:/home/django/data, cvat_keys:/home/django/keys, cvat_logs:/home/django/logs, ./config/mot20_local.py:/home/django/cvat/settings/mot20_local.py:ro]

  cvat_ui:
    image: cvat/ui:v2.18.0
    restart: unless-stopped
    depends_on: [cvat_server]
  cvat_proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [cvat_server, cvat_ui]
    ports: ["${CVAT_HOST_PORT:-8082}:8080"]
    volumes: [./config/nginx.conf:/etc/nginx/nginx.conf:ro]

volumes:
  cvat_db:
  cvat_data:
  cvat_keys:
  cvat_logs:
  cvat_inmem_data:
  cvat_cache_db:
